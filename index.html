<!DOCTYPE html>
<html lang="pt-BR">
<head><script src="https://myhub.ia.br/canvas-vendor/tailwind.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2">
<title>Impostor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f2;--sf:#fff;--ink:#1c1b1f;--mute:#6b6a70;--line:#e7e5e0;--soft:#eeece8;--acc:#c8203f;--acc-s:#fbe9ec;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{max-width:480px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px 150px}
.screen{display:none}.screen.on{display:block;animation:in .4s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.mono{font-family:'Geist Mono',monospace}
.tag{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.head{display:flex;align-items:flex-end;justify-content:space-between;margin:8px 0 24px}
h1{font-size:44px;font-weight:800;letter-spacing:-.05em;line-height:1}
h1 b{color:var(--acc)}
h2{font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:8px 0 16px}
.card-s{background:var(--sf);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.lbl{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.lbl h3{font-size:15px;font-weight:600}
.lbl .mono{font-size:12px;color:var(--mute)}
.pr{display:flex;align-items:center;gap:8px;padding:4px 0;animation:in .3s var(--ease)}
.pr .n{width:28px;height:28px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-family:'Geist Mono';font-size:12px;color:var(--mute);flex:none}
.pr input{flex:1;min-width:0;border:1px solid transparent;background:var(--soft);border-radius:12px;padding:12px 14px;font-size:17px;transition:.2s}
.pr input:focus{outline:none;background:var(--sf);border-color:var(--ink)}
.pr input::placeholder{color:#9a999e}
.rm{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--mute);flex:none}
.rm:disabled{opacity:.2;cursor:default}
.addp{margin-top:8px;width:100%;border:1.5px dashed var(--line);border-radius:12px;padding:12px;font-size:15px;font-weight:600;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:8px;transition:.2s}
.addp:active{transform:scale(.98);border-color:var(--ink);color:var(--ink)}
.addp:disabled{opacity:.35}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--sf);padding:10px 14px;border-radius:999px;font-size:15px;transition:.2s var(--ease)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.chip.hot.on{background:var(--acc);border-color:var(--acc)}
.chip:active{transform:scale(.95)}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.sw i{width:36px;height:22px;border-radius:99px;background:var(--line);position:relative;transition:.25s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
.sw[aria-checked=true] i{background:var(--ink)}.sw[aria-checked=true] i::after{transform:translateX(14px)}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0}
.set+.set{border-top:1px solid var(--line)}
.set span{font-size:15px;font-weight:500}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:8px 12px;border-radius:9px;font-size:14px;font-weight:500;color:var(--mute);transition:.2s var(--ease)}
.seg button.on{background:var(--sf);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(28,27,31,.12)}
.seg button:disabled{opacity:.3}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(246,245,242,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.dock>div{max-width:480px;margin:0 auto;display:grid;gap:8px}
.btn{width:100%;border-radius:16px;padding:17px;font-size:17px;font-weight:700;background:var(--ink);color:#fff;transition:transform .2s var(--ease)}
.btn:active{transform:scale(.98)}
.btn.acc{background:var(--acc)}
.btn.ghost{background:var(--sf);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.3}
.err{color:var(--acc);font-size:14px;text-align:center;font-weight:500}
.err:empty{display:none}
.stage{min-height:calc(100dvh - 190px);display:flex;flex-direction:column;justify-content:center;text-align:center}
.who{font-size:clamp(40px,12vw,56px);font-weight:800;letter-spacing:-.045em;line-height:1;margin:4px 0 24px;word-break:break-word}
.card{position:relative;height:min(50dvh,360px);user-select:none;-webkit-user-select:none;touch-action:none;perspective:1200px}
.face{position:absolute;inset:0;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;backface-visibility:hidden;transition:transform .5s var(--ease)}
.front{background:var(--sf);border:1px solid var(--line);box-shadow:0 20px 40px -28px rgba(60,50,40,.4)}
.front .ic{width:68px;height:68px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;margin-bottom:16px;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
.back{transform:rotateY(180deg);background:var(--sf);border:1px solid var(--line)}
.back.imp{background:var(--acc);border-color:var(--acc);color:#fff}
.card.flip .front{transform:rotateY(-180deg)}.card.flip .back{transform:none}
.word{font-size:clamp(34px,10vw,48px);font-weight:800;letter-spacing:-.04em;line-height:1.02;margin:12px 0}
.small{font-size:14px;color:var(--mute)}.imp .small,.imp .tag{color:rgba(255,255,255,.85)}
.pill{display:inline-block;margin-top:8px;background:rgba(255,255,255,.2);padding:8px 16px;border-radius:12px;font-size:20px;font-weight:600}
.prog{display:flex;gap:4px;justify-content:center;margin-bottom:24px}
.prog span{height:4px;flex:1;max-width:24px;border-radius:4px;background:var(--line)}
.prog span.d{background:var(--ink)}
.roul{font-size:clamp(46px,14vw,68px);font-weight:800;letter-spacing:-.05em;line-height:1;min-height:1.1em;margin:24px 0 8px}
.roul.done{color:var(--acc);animation:pop .5s var(--ease)}
@keyframes pop{0%{transform:scale(.75)}60%{transform:scale(1.08)}}
.dir{font-size:15px;color:var(--mute);opacity:0;transition:opacity .4s}.dir.on{opacity:1}
.order{list-style:none;margin:8px 0 16px;background:var(--sf);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.order li{display:flex;gap:16px;align-items:center;padding:14px 16px;font-size:18px;animation:in .4s var(--ease) backwards}
.order li+li{border-top:1px solid var(--line)}
.order li .mono{font-size:12px;color:var(--mute);width:20px}
.order li.first{font-weight:600}
.badge{margin-left:auto;font-size:12px;background:var(--acc-s);color:var(--acc);padding:4px 10px;border-radius:99px;font-weight:600}
.timer{font-family:'Geist Mono',monospace;font-size:68px;font-weight:600;letter-spacing:-.04em;text-align:center;padding:12px 0}
.timer.low{color:var(--acc);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.vote{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vote button{background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:22px 12px;font-size:18px;font-weight:600;transition:.2s var(--ease)}
.vote button:active{transform:scale(.96);border-color:var(--acc);color:var(--acc)}
.result{font-size:clamp(42px,12vw,60px);font-weight:800;letter-spacing:-.05em;line-height:.95;margin:8px 0 24px}
.row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;font-size:16px}
.row+.row{border-top:1px solid var(--line)}
.row span:first-child{color:var(--mute)}.row span:last-child{text-align:right;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center}
.link{font-size:13px;color:var(--mute);text-decoration:underline}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main>

<section class="screen on" id="s-setup">
  <div class="head"><h1>Imp<b>o</b>stor</h1><span class="tag">passa o celular</span></div>
  <div class="card-s">
    <div class="lbl"><h3>Jogadores</h3><span class="mono" id="pc">3/12</span></div>
    <div id="plist"></div>
    <button class="addp" id="addBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Adicionar jogador</button>
  </div>
  <div class="card-s">
    <div class="lbl"><h3>Tema</h3><button class="sw" role="switch" aria-checked="false" id="multi">Misturar <i></i></button></div>
    <div class="chips" id="themes"></div>
  </div>
  <div class="card-s">
    <div class="set"><span>Impostores</span><div class="seg" id="impSeg"></div></div>
    <div class="set"><span>Pista</span><div class="seg" id="hintSeg"></div></div>
    <div class="set"><span>Tempo</span><div class="seg" id="timeSeg"></div></div>
  </div>
  <div class="card-s" id="scoreBox" style="display:none">
    <div class="lbl"><h3>Placar</h3><button class="link" id="rsBtn">zerar</button></div>
    <div id="scoreList"></div>
  </div>
</section>

<section class="screen" id="s-pass">
  <div class="stage">
    <div class="prog" id="prog"></div>
    <p class="small">Passa pra</p>
    <div class="who" id="passName"></div>
    <div class="card" id="card" role="button" tabindex="0" aria-label="Segure para ver seu papel">
      <div class="face front">
        <div class="ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></div>
        <div style="font-weight:800;font-size:22px">Segure pra ver</div>
      </div>
      <div class="face back" id="back"></div>
    </div>
  </div>
</section>

<section class="screen" id="s-draw">
  <div class="stage">
    <div class="tag">Quem começa</div>
    <div class="roul" id="roul">...</div>
    <div class="dir" id="dir"></div>
  </div>
</section>

<section class="screen" id="s-talk">
  <div class="top"><div class="tag">Uma palavra cada</div><div class="tag" id="themeInfo"></div></div>
  <ol class="order" id="order" style="margin-top:16px"></ol>
  <div id="timerWrap" style="display:none"><div class="timer" id="timer">3:00</div></div>
</section>

<section class="screen" id="s-vote">
  <div class="tag">Votação</div>
  <h2>Quem é o impostor?</h2>
  <div class="vote" id="vote"></div>
</section>

<section class="screen" id="s-guess">
  <div class="stage">
    <div class="tag">Última chance</div>
    <h2 id="guessTitle"></h2>
    <p class="small">Ele chuta a palavra em voz alta.</p>
  </div>
</section>

<section class="screen" id="s-end">
  <div class="tag" id="endTag"></div>
  <div class="result" id="endTitle"></div>
  <div class="card-s" id="endInfo"></div>
  <div class="card-s"><div class="lbl"><h3>Placar</h3></div><div id="endScore"></div></div>
</section>

</main>
<div class="dock"><div id="dock"></div></div>

const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const X='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

function dock(btns){$('dock').innerHTML=btns.map(b=>b.err?`<div class="err" id="err" role="alert"></div>`:`<button class="btn ${b.c||''}" id="${b.id}" ${b.dis?'disabled':''}>${b.t}</button>`).join('');btns.forEach(b=>{if(b.f)$(b.id).onclick=b.f})}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');scrollTo(0,0)}
function toast(m){const e=$('err');if(e){e.textContent=m;vib([30,40,30]);clearTimeout(e._t);e._t=setTimeout(()=>e.textContent='',2600)}}

function renderP(){
  const n=S.names.length;
  $('plist').innerHTML=S.names.map((v,i)=>`<div class="pr"><span class="n">${i+1}</span><input value="${esc(v)}" placeholder="Jogador ${i+1}" maxlength="14" autocomplete="off" enterkeyhint="next" data-i="${i}" aria-label="Nome do jogador ${i+1}"><button class="rm" data-rm="${i}" aria-label="Remover jogador ${i+1}" ${n<=3?'disabled':''}>${X}</button></div>`).join('');
  $('plist').querySelectorAll('input').forEach(inp=>{const i=+inp.dataset.i;
    inp.oninput=()=>S.names[i]=inp.value;
    inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const nx=$('plist').querySelector(`input[data-i="${i+1}"]`);nx?nx.focus():inp.blur()}}});
  $('plist').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{S.names.splice(+b.dataset.rm,1);vib(10);renderP()});
  $('pc').textContent=n+'/12';$('addBtn').disabled=n>=12;
  if(S.imp===2&&n<6)S.imp=1;renderSegs()}
$('addBtn').onclick=()=>{if(S.names.length>=12)return;S.names.push('');vib(10);renderP();$('plist').querySelector(`input[data-i="${S.names.length-1}"]`).focus()};
$('multi').onclick=()=>{S.multi=!S.multi;$('multi').setAttribute('aria-checked',S.multi);if(!S.multi&&S.themes.size>1)S.themes=new Set([[...S.themes][0]]);renderThemes()};
$('rsBtn').onclick=()=>{S.score={};renderScore('scoreList')};
function renderThemes(){$('themes').innerHTML='';Object.keys(DATA).forEach(t=>{const b=document.createElement('button');const on=S.themes.has(t);
  b.className='chip'+(on?' on':'')+(t==='+18'?' hot':'');b.textContent=t;b.setAttribute('aria-pressed',on);
  b.onclick=()=>{if(S.multi){on&&S.themes.size>1?S.themes.delete(t):S.themes.add(t)}else S.themes=new Set([t]);vib(8);renderThemes()};$('themes').appendChild(b)})}
function seg(id,opts,key){$(id).innerHTML='';opts.forEach(([v,l,dis])=>{const b=document.createElement('button');b.className=S[key]===v?'on':'';b.textContent=l;b.disabled=!!dis;b.setAttribute('aria-pressed',S[key]===v);b.onclick=()=>{S[key]=v;vib(8);renderSegs()};$(id).appendChild(b)})}
function renderSegs(){
  seg('impSeg',[[1,'1'],[2,'2',S.names.length<6]],'imp');
  seg('hintSeg',[[true,'Com'],[false,'Sem']],'hint');
  seg('timeSeg',[[0,'Off'],[60,'1m'],[120,'2m'],[180,'3m'],[300,'5m']],'time')}
function renderScore(el){const e=Object.entries(S.score).sort((a,b)=>b[1]-a[1]);
  $(el).innerHTML=e.map(([n,p],i)=>`<div class="row"><span>${i+1}º ${esc(n)}</span><span class="mono">${p}</span></div>`).join('');
  if(el==='scoreList')$('scoreBox').style.display=e.length?'block':'none'}
function setupDock(){dock([{err:1},{id:'go',t:'Começar',c:'acc',f:start}])}
function goSetup(){show('s-setup');renderP();renderScore('scoreList');setupDock()}

function pickWord(){let pool=[];S.themes.forEach(t=>DATA[t].forEach(w=>pool.push({t,w:w[0],h:w[1]})));
  let fresh=pool.filter(p=>!S.used.has(p.w));if(!fresh.length){S.used.clear();fresh=pool}
  const p=rnd(fresh);S.used.add(p.w);return p}
function pickHint(p){const k=p.t+'|'+p.w,u=S.hu[k]||(S.hu[k]=new Set());
  let f=p.h.filter(h=>!u.has(h));if(!f.length){u.clear();f=p.h}
  const h=rnd(f);u.add(h);return h}
async function start(){
  const names=S.names.map((n,i)=>n.trim()||'Jogador '+(i+1));
  if(new Set(names.map(n=>n.toLowerCase())).size!==names.length){goSetup();return toast('Tem nome repetido.')}
  P=names;
  try{wake=await navigator.wakeLock?.request('screen')}catch(e){}
  const p=pickWord();
  G={...p,hint:pickHint(p),imps:shuffle([...P.keys()]).slice(0,S.imp),i:0,useHint:S.hint};
  showPass()}
function showPass(){
  $('card').classList.remove('flip');G.seen=false;
  $('prog').innerHTML=P.map((_,k)=>`<span class="${k<G.i?'d':''}"></span>`).join('');
  $('passName').textContent=P[G.i];
  const isImp=G.imps.includes(G.i),b=$('back');
  b.className='face back'+(isImp?' imp':'');
  b.innerHTML=isImp
    ?`<div class="tag">Você é o</div><div class="word">IMPOSTOR</div>${G.useHint?`<div class="small">Pista</div><div class="pill">${G.hint}</div>`:'<div class="small">Sem pista. Se vira.</div>'}<div class="small" style="margin-top:16px">${G.t}${S.imp>1?' · tem outro impostor':''}</div>`
    :`<div class="tag">Palavra</div><div class="word">${G.w}</div><div class="small">${G.t}</div>`;
  show('s-pass');
  dock([{id:'seen',t:G.i<P.length-1?'Próximo':'Sortear quem começa',dis:true,f:nextPlayer}])}
(function(){const c=$('card');
  const on=e=>{e.preventDefault();c.classList.add('flip');vib(15);if(!G.seen){G.seen=true;$('seen').disabled=false}};
  const off=()=>c.classList.remove('flip');
  c.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(ev=>c.addEventListener(ev,off));
  c.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter')on(e)});c.addEventListener('keyup',off);
  c.addEventListener('contextmenu',e=>e.preventDefault())})();
function nextPlayer(){G.i++;G.i<P.length?showPass():draw()}

function draw(){
  show('s-draw');dock([]);
  const r=$('roul'),d=$('dir'),n=P.length;r.classList.remove('done');d.classList.remove('on');
  const first=Math.floor(Math.random()*n);G.cw=Math.random()<.5;
  let k=0,delay=50;const steps=18+Math.floor(Math.random()*6);
  const tick=()=>{r.textContent=P[((first+k-steps)%n+n)%n];vib(5);k++;
    if(k<=steps){delay*=1.13;setTimeout(tick,delay)}
    else{r.textContent=P[first];r.classList.add('done');vib([40,60,80]);
      d.textContent=G.cw?'Segue na ordem da roda':'Segue no sentido contrário';d.classList.add('on');
      G.first=first;setTimeout(()=>dock([{id:'ok',t:'Ver ordem',f:showTalk}]),500)}};
  tick()}
function showTalk(){
  clearInterval(tInt);const n=P.length;
  G.order=[...Array(n)].map((_,k)=>P[((G.first+(G.cw?k:-k))%n+n)%n]);
  $('themeInfo').textContent=G.t;
  $('order').innerHTML=G.order.map((x,k)=>`<li class="${k?'':'first'}" style="animation-delay:${k*50}ms"><span class="mono">${String(k+1).padStart(2,'0')}</span>${esc(x)}${k?'':'<span class="badge">começa</span>'}</li>`).join('');
  $('timerWrap').style.display='none';show('s-talk');
  const b=[{id:'vt',t:'Votar',c:'acc',f:goVote}];
  if(S.time)b.unshift({id:'tm',t:'Iniciar tempo',c:'ghost',f:startTimer});
  dock(b)}
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function startTimer(){
  let s=S.time;$('timerWrap').style.display='block';$('tm').style.display='none';
  const el=$('timer');el.textContent=fmt(s);el.classList.remove('low');
  tInt=setInterval(()=>{s--;el.textContent=fmt(Math.max(s,0));if(s<=10)el.classList.add('low');if(s<=10&&s>0)vib(30);
    if(s<=0){clearInterval(tInt);vib([300,100,300]);el.textContent='Votem'}},1000)}
function goVote(){clearInterval(tInt);
  $('vote').innerHTML='';P.forEach((n,k)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{vib(20);vote(k)};$('vote').appendChild(b)});
  show('s-vote');dock([])}
function vote(k){G.voted=k;
  if(G.imps.includes(k)){$('guessTitle').innerHTML=`${esc(P[k])}<br><span style="color:var(--acc)">era impostor</span>`;show('s-guess');
    dock([{id:'gn',t:'Errou a palavra',f:()=>finish('crew')},{id:'gy',t:'Acertou',c:'ghost',f:()=>finish('imp')}])}
  else finish('wrong')}
function finish(r){
  try{wake?.release()}catch(e){}
  const crew=r==='crew',impNames=G.imps.map(i=>P[i]);
  P.forEach(n=>S.score[n]=S.score[n]||0);
  if(crew)P.forEach((n,i)=>{if(!G.imps.includes(i))S.score[n]++});
  else impNames.forEach(n=>S.score[n]+=r==='imp'?1:2);
  $('endTag').textContent=crew?'Vitória do grupo':'Vitória do impostor';
  $('endTitle').innerHTML=crew?'Pegaram<br>o farsante.':r==='imp'?'Pego, mas<br>sabia a palavra.':`${esc(P[G.voted])}<br>era inocente.`;
  $('endTitle').style.color=crew?'var(--ink)':'var(--acc)';
  $('endInfo').innerHTML=`<div class="row"><span>${impNames.length>1?'Impostores':'Impostor'}</span><span>${impNames.map(esc).join(' e ')}</span></div><div class="row"><span>Palavra</span><span>${G.w}</span></div><div class="row"><span>Pista</span><span>${G.useHint?G.hint:'Nenhuma'}</span></div>`;
  renderScore('endScore');show('s-end');vib(crew?[50,50,50]:[200]);
  dock([{id:'nr',t:'Nova rodada',c:'acc',f:start},{id:'cf',t:'Editar jogadores ou tema',c:'ghost',f:goSetup}])}
renderP();renderThemes();renderScore('scoreList');setupDock();
</script>
</body>
</html>
